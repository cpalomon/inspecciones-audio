<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grabador de Inspecciones</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 5px;
        }

        h3 {
            font-size: 16px;
            color: #666;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            margin-bottom: 10px;
            color: white;
            cursor: pointer;
        }

        .btn-start {
            background-color: #28a745;
        }

        .btn-stop {
            background-color: #dc3545;
        }

        .btn-download {
            background-color: #007bff;
        }

        .btn:active {
            transform: scale(0.98);
        }

        #status {
            margin: 15px 0;
            font-size: 16px;
        }

        audio {
            width: 100%;
            margin-top: 15px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
        }

    </style>
</head>
<body>

<div class="container">

    <h1>🎤 Inspección EPP</h1>
    <h3>Ambiente y Soluciones SAS</h3>

    <div class="card">

        <button class="btn btn-start" onclick="startRecording()">▶️ Iniciar Grabación</button>

        <button class="btn btn-stop" onclick="stopRecording()">⛔ Detener</button>

        <p id="status">Estado: esperando...</p>

        <audio id="audioPlayback" controls></audio>

        <a id="downloadLink" style="display:none;">
            <button class="btn btn-download">⬇️ Descargar audio</button>
        </a>

    </div>

</div>

<script>
let mediaRecorder;
let chunks = [];

async function startRecording() {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

    const options = { mimeType: 'audio/webm;codecs=opus' };
    mediaRecorder = new MediaRecorder(stream, options);

    chunks = [];

    mediaRecorder.ondataavailable = e => {
        if (e.data.size > 0) {
            chunks.push(e.data);
        }
    };

    mediaRecorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'audio/webm' });

        const audioURL = URL.createObjectURL(blob);
        document.getElementById("audioPlayback").src = audioURL;

        const link = document.getElementById("downloadLink");
        link.href = audioURL;
        link.download = "inspeccion_" + Date.now() + ".webm";
        link.style.display = "block";

        document.getElementById("status").innerText = "✅ Listo para descargar";
    };

    mediaRecorder.start();
    document.getElementById("status").innerText = "🔴 Grabando...";
}

function stopRecording() {
    if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
        document.getElementById("status").innerText = "⏳ Procesando...";
    }
}
</script>

</body>
</html>
