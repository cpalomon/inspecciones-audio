<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Grabador de Inspecciones</title>
</head>
<body>

<h2>🎤 Grabación de inspección EPP</h2>

<br>

<button onclick="startRecording()">▶️ Iniciar Grabación</button>
<button onclick="stopRecording()">⛔ Detener</button>

<p id="status">Estado: esperando...</p>

<br>

<audio id="audioPlayback" controls></audio>

<script>
let mediaRecorder;
let chunks = [];

async function startRecording() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

        // ✅ Formato estable para Android
        const options = { mimeType: 'audio/webm;codecs=opus' };

        mediaRecorder = new MediaRecorder(stream, options);

        chunks = [];

        mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) {
                chunks.push(e.data);
            }
        };

        mediaRecorder.onstop = async () => {
            const blob = new Blob(chunks, { type: 'audio/webm' });

            // ✅ Reproducir
            const audioURL = URL.createObjectURL(blob);
            document.getElementById("audioPlayback").src = audioURL;

            document.getElementById("status").innerText = "📤 Enviando audio...";

            // ✅ Enviar al servidor
            const formData = new FormData();
            formData.append("file", blob, "audio.webm");

            try {
                const response = await fetch("/upload", {
                    method: "POST",
                    body: formData
                });

                const result = await response.json();

                console.log(result);

                document.getElementById("status").innerText = "✅ Audio guardado correctamente";
            } catch (error) {
                console.error(error);
                document.getElementById("status").innerText = "❌ Error al guardar";
            }
        };

        mediaRecorder.start();
        document.getElementById("status").innerText = "🔴 Grabando...";
    } catch (error) {
        console.error(error);
        document.getElementById("status").innerText = "❌ Error al acceder al micrófono";
    }
}

function stopRecording() {
    if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
        document.getElementById("status").innerText = "⏳ Procesando...";
    }
}
</script>

</body>
</html>
