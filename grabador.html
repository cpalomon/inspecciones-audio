<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Grabador de Inspecciones</title>
</head>
<body>

  <h2>Grabación de inspección EPP</h2>

  <button onclick="startRecording()">🎤 Iniciar Grabación</button>
  <button onclick="stopRecording()">⛔ Detener</button>

  <p id="status"></p>

  <audio id="audioPlayback" controls></audio>

  <script>
    let mediaRecorder;
    let chunks = [];

    async function startRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

        let options = {};

        if (MediaRecorder.isTypeSupported('audio/webm')) {
          options.mimeType = 'audio/webm';
        } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
          options.mimeType = 'audio/mp4';
        } else if (MediaRecorder.isTypeSupported('audio/ogg')) {
          options.mimeType = 'audio/ogg';
        }

        mediaRecorder = new MediaRecorder(stream, options);

        chunks = [];

        mediaRecorder.ondataavailable = function(e) {
          if (e.data.size > 0) {
            chunks.push(e.data);
          }
        };

        mediaRecorder.onstop = function() {
          const blob = new Blob(chunks, { type: chunks[0].type });
          const audioURL = URL.createObjectURL(blob);

          document.getElementById("audioPlayback").src = audioURL;
          document.getElementById("status").innerText = "Grabación lista ✅";
        };

        mediaRecorder.start();
        document.getElementById("status").innerText = "Grabando...";
      } catch (error) {
        console.error(error);
        document.getElementById("status").innerText = "Error al acceder al micrófono 🚨";
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
        document.getElementById("status").innerText = "Procesando audio...";
      }
    }
  </script>

</body>
</html>
